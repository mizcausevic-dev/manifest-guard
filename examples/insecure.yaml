# Deliberately insecure manifest: every rule in manifest-guard should fire at least once.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: legacy-api
spec:
  replicas: 1
  selector:
    matchLabels: { app: legacy-api }
  template:
    metadata:
      labels: { app: legacy-api }
    spec:
      hostNetwork: true
      volumes:
        - name: docker-sock
          hostPath:
            path: /var/run/docker.sock
      containers:
        - name: api
          image: example.com/legacy-api:latest
          securityContext:
            privileged: true
            runAsUser: 0
            capabilities:
              add: ["SYS_ADMIN", "NET_ADMIN"]
          env:
            - name: DB_PASSWORD
              value: hunter2
            - name: LOG_LEVEL
              value: debug
          volumeMounts:
            - { name: docker-sock, mountPath: /var/run/docker.sock }
---
apiVersion: v1
kind: Service
metadata:
  name: legacy-api
  namespace: default
spec:
  type: LoadBalancer
  selector: { app: legacy-api }
  ports: [{ port: 80, targetPort: 8080 }]
