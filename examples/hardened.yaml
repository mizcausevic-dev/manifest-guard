# Hardened reference manifest: manifest-guard should report zero findings.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments
  namespace: payments
  labels: { app.kubernetes.io/name: payments }
spec:
  replicas: 3
  selector:
    matchLabels: { app.kubernetes.io/name: payments }
  template:
    metadata:
      labels: { app.kubernetes.io/name: payments }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: payments
          image: registry.example.com/payments:2.14.3@sha256:4f2b8c1e9a7d6c5b4a3f2e1d0c9b8a7f6e5d4c3b2a1f0e9d8c7b6a5f4e3d2c1b
          ports: [{ containerPort: 8080 }]
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: payments-db, key: password }
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { memory: 512Mi }
          readinessProbe:
            httpGet: { path: /ready, port: 8080 }
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: payments
  namespace: payments
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: payments }
  ports: [{ port: 80, targetPort: 8080 }]
